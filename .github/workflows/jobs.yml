# The release-day job and the evening score on a runner (docs/steps/loop-off-the-laptop.md).
# Step 2, the shadow run: beside the laptop, committing and opening nothing but the morning's two
# issues of step 46 (docs/steps/loop-nets.md); the day's rows and the evening's files are uploaded
# as the run's artifact. The store travels as an encrypted release
# asset (docs/decisions.md, 2026-11-14).
name: Jobs

on:
  # Started only on demand: by the outside timer at 07:30 and 18:30 New York (docs/decisions.md,
  # 2026-11-17), since GitHub's schedule started hours late, or by hand.
  workflow_dispatch:
    inputs:
      step:
        description: "live: the morning call; score: the evening loads and grading"
        type: choice
        options: [live, score]
        default: live

permissions:
  contents: write
  pull-requests: read
  # The morning's watches (docs/steps/loop-nets.md) list the runs and open their issues.
  actions: read
  issues: write

concurrency:
  group: jobs
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Which step
        id: plan
        env:
          ASKED: ${{ inputs.step }}
        run: |
          echo "step=$ASKED" >>"$GITHUB_OUTPUT"
          echo "step: $ASKED, asked at $(TZ=America/New_York date +%H:%M) New York"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.step != ''
        with:
          # The whole history: `triggers` and the guesses read when each file was merged from the
          # commit that added it, which a one-commit clone puts at its newest merge.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        if: steps.plan.outputs.step != ''
        with:
          python-version: "3.12"

      - name: The store, downloaded and decrypted
        if: steps.plan.outputs.step != ''
        env:
          FT_STORE_KEY: ${{ secrets.FT_STORE_KEY }}
        run: |
          [ -n "$FT_STORE_KEY" ] || { echo "FT_STORE_KEY is not set"; exit 1; }
          uv sync --locked
          gh release download store -R "$REPO" -p store.tar.gpg -D "$RUNNER_TEMP"
          gpg --batch --decrypt --passphrase-file <(printf '%s' "$FT_STORE_KEY") \
            "$RUNNER_TEMP/store.tar.gpg" | tar -xzf -
          ls -la data/fortuneteller.duckdb
          mkdir -p out

      - name: The morning call
        if: steps.plan.outputs.step == 'live'
        run: |
          at=$(TZ=America/New_York date -d "08:30:05" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$at" ]; then
            echo "waiting $((at - now))s for 08:30:05 New York"
            sleep $((at - now))
          fi
          set +e
          FT_CALLS_PATH=data/calls.csv uv run fortuneteller live 2>&1 | tee out/live.txt
          status=${PIPESTATUS[0]}
          git diff -U0 -- data/calls.csv | tee out/calls.diff
          cp data/calls.csv out/
          exit "$status"

      # Step 46, the safety nets (docs/steps/loop-nets.md): the morning watches the laptop's
      # morning and its own evening before, and opens an issue for what was missed; one that
      # cannot be opened fails nothing. Run also when `live` failed, since the evening is checked
      # every weekday.
      - name: The watches
        if: ${{ !cancelled() && steps.plan.outputs.step == 'live' }}
        run: |
          day=$(TZ=America/New_York date +%F)
          issue() {
            gh issue create -R "$REPO" --title "$1" --body "$2" || echo "could not open: $1"
          }
          # The laptop's rows are due by 08:45 New York, in main or a calls-* branch; checked
          # only when this run logged rows of its own to compare.
          if grep -q '^+[0-9]' out/calls.diff 2>/dev/null; then
            at=$(TZ=America/New_York date -d "08:45" +%s)
            now=$(date +%s)
            if [ "$now" -lt "$at" ]; then
              echo "waiting $((at - now))s for 08:45 New York"
              sleep $((at - now))
            fi
            git fetch -q --prune origin '+refs/heads/main:refs/remotes/origin/main' \
              '+refs/heads/calls-*:refs/remotes/origin/calls-*'
            theirs=()
            for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/main \
              'refs/remotes/origin/calls-*'); do
              file="$RUNNER_TEMP/theirs-${#theirs[@]}.csv"
              git show "$ref:data/calls.csv" >"$file" || : >"$file"
              echo "$ref: $(grep -c ",$day," "$file") rows of $day"
              theirs+=("$file")
            done
            missing=$(uv run fortuneteller unlogged "$day" data/calls.csv "${theirs[@]}")
            if [ -n "$missing" ]; then
              echo "$missing"
              issue "The laptop did not log $day's calls" "$missing"
            fi
          fi
          # The outside timer asks the evening every weekday; Monday checks Friday's.
          case $(TZ=America/New_York date +%u) in
            1) before=$(date -d "$day -3 days" +%F) ;;
            [2-5]) before=$(date -d "$day -1 day" +%F) ;;
            *) before= ;;
          esac
          if [ -n "$before" ]; then
            if gh run list -R "$REPO" -w jobs.yml --json createdAt,event -L 50 \
              >"$RUNNER_TEMP/runs.json"; then
              missing=$(uv run fortuneteller unstarted --evening "$before" "$RUNNER_TEMP/runs.json")
              if [ -n "$missing" ]; then
                echo "$missing"
                issue "The runner's evening was not started on $before" "$missing"
              fi
            else
              echo "gh run list failed; the evening of $before is not checked"
            fi
          fi

      - name: The evening loads and grading
        if: steps.plan.outputs.step == 'score'
        id: score
        env:
          FT_FRED_API_KEY: ${{ secrets.FT_FRED_API_KEY }}
        run: |
          waiting=$(gh pr list -R "$REPO" --state open --json headRefName --jq \
            '.[].headRefName | select(startswith("calls-") or startswith("score-") or startswith("triggers-"))')
          if [ -n "$waiting" ]; then
            echo "score: waiting for $waiting to be merged" | tee out/score.txt
            exit 0
          fi
          for command in load-releases load-prices load-surprises; do
            uv run fortuneteller "$command" 2>&1 | tee -a out/loads.txt
            [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
          done
          echo "loaded=1" >>"$GITHUB_OUTPUT"
          FT_CALLS_PATH=data/calls.csv uv run fortuneteller score >data/score.txt
          cp data/score.txt out/
          if grep -q '^pending: ' data/score.txt; then
            echo "score: rows pending; no triggers, as on the laptop"
            exit 0
          fi
          uv run fortuneteller triggers | tee out/triggers.txt
          cp data/trigger-log.csv out/

      - name: The store, encrypted and uploaded
        if: steps.score.outputs.loaded == '1'
        env:
          FT_STORE_KEY: ${{ secrets.FT_STORE_KEY }}
        run: |
          tar -czf - data/fortuneteller.duckdb data/cache |
            gpg --batch --yes --symmetric --cipher-algo AES256 --compress-algo none \
              --passphrase-file <(printf '%s' "$FT_STORE_KEY") -o "$RUNNER_TEMP/store.tar.gpg"
          gh release upload store -R "$REPO" "$RUNNER_TEMP/store.tar.gpg" --clobber

      - uses: actions/upload-artifact@v4
        if: always() && steps.plan.outputs.step != ''
        with:
          name: ${{ steps.plan.outputs.step }}-${{ github.run_id }}
          path: out/
          retention-days: 90
